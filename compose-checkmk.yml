volumes:
  checkmk_sites:

services:
  checkmk:
    container_name: checkmk
    image: 'checkmk/check-mk-raw:2.4.0-2026.01.10'
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
    volumes:
      - checkmk_sites:/omd/sites
    tmpfs:
      - /opt/omd/sites/${CHECKMK_SITE}/tmp:uid=1000,gid=1000
    ports:
      - 8006:5000
      - 8007:8000
    environment:
      TZ: Europe/London
      CMK_SITE_ID: ${CHECKMK_SITE}
      CMK_PASSWORD: ${CHECKMK_PASSWORD}
    networks:
      - frontend
    labels:
      - traefik.enable=true
      - traefik.docker.network=home-server_frontend
      - traefik.http.routers.checkmk.rule=Host(`monitoring.${DNS_SUFFIX}`)
      - traefik.http.routers.checkmk.entrypoints=web
